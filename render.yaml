# Render Blueprint for the WeatherGPT backend (Dashboard → New → Blueprint →
# pick this repo). The frontend goes on Vercel; see docs/DEPLOYMENT.md.
#
# Secrets are `sync: false`: Render asks for each value when you create the
# Blueprint, and they never live in git.
services:
  - type: web
    name: weathergpt-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free            # 512 MB. If GFS (/api/nwp) runs out of memory, use "starter" or WITH_NWP=0.
    region: singapore     # closest Render region to India
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # 1 = GFS/NWP included (about 760 MB image); 0 = lighter image, /api/nwp answers 503.
      # Render passes environment variables to `docker build` as build args.
      - key: WITH_NWP
        value: "1"
      # Your Vercel URL(s), comma-separated, no trailing slash.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ALERT_JOB_TOKEN
        generateValue: true   # Render makes a random token; copy it into the GitHub secret
      - key: LLM_PROVIDER
        value: none
