# Backend tests, frontend lint + build, and the Playwright e2e suite on every
# push and pull request. Everything is mocked: no secrets or network services.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: pytest (offline, all mocked)
        run: python -m pytest tests/ -q -rf
        env:
          PYTHONIOENCODING: utf-8

  frontend:
    name: Frontend lint, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: weathergpt-web
    env:
      # Placeholders: the build needs the names; Playwright mocks Supabase and the backend.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: weathergpt-web/package-lock.json
      - run: npm ci
      - run: npx eslint
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (screenshots excluded)
        run: npx playwright test --grep-invert @screens
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: weathergpt-web/test-results/
          retention-days: 7
