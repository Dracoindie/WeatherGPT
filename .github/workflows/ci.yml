# Backend tests, frontend lint + build, and the Playwright e2e suite on every
# push and pull request. Everything is mocked: no secrets or network services.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: pytest (offline, all mocked)
        run: python -m pytest tests/ -q -rf
        env:
          PYTHONIOENCODING: utf-8

  frontend:
    name: Frontend lint, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: weathergpt-web
    env:
      # Placeholders: the build needs the names; Playwright mocks Supabase and the backend.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: weathergpt-web/package-lock.json
      - run: npm ci
      - run: npx eslint
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (screenshots excluded)
        run: npx playwright test --grep-invert @screens
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: weathergpt-web/test-results/
          retention-days: 7

  docker:
    # The production backend images (backend/Dockerfile), both variants, built
    # and started on every push: docs/DEPLOYMENT.md relies on this job instead
    # of a local Docker build. No secrets: /health needs none.
    name: Backend image (WITH_NWP=${{ matrix.nwp }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nwp: ["1", "0"]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build --build-arg WITH_NWP=${{ matrix.nwp }} -t weathergpt-api:nwp${{ matrix.nwp }} backend
      - name: Image size
        run: docker image ls weathergpt-api:nwp${{ matrix.nwp }} --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Smoke test (start the image, GET /health)
        run: |
          docker run -d --name api -p 8000:8000 -e PORT=8000 -e ALLOWED_ORIGINS=http://localhost:3000 weathergpt-api:nwp${{ matrix.nwp }}
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8000/health -o health.json; then break; fi
            sleep 2
          done
          cat health.json; echo
          # status ok; nwp true only in the full image (cfgrib + ecCodes load), false in the lite one
          jq -e --argjson nwp ${{ matrix.nwp == '1' && 'true' || 'false' }} '.status == "ok" and .nwp == $nwp' health.json
          # the container's own HEALTHCHECK agrees
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' api)
            [ "$s" = "healthy" ] && break
            sleep 2
          done
          echo "container health: $s"
          test "$s" = "healthy"
      - name: Container log
        if: always()
        run: docker logs api 2>&1 | tail -50 || true
